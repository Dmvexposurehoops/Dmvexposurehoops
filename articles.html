<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><link rel="stylesheet" href="site.css"><title>Scouting & Articles | DMVExposureHoops</title></head><body><header><a class="logo" href="index.html">DMV<span>Exposure</span>Hoops</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="players.html">Players</a><a href="watchlists.html">Watchlists</a><a href="rankings.html">Rankings</a><a href="articles.html">Articles</a><a href="exposure.html">Get Exposure</a></nav></header><main><div class="eyebrow">DMV basketball coverage</div><h1 class="page-title">Scouting & Articles</h1><p class="page-subtitle">Player features, scouting notes and updates from around the DMV.</p><div class="toolbar"><input id="search" type="search" placeholder="Search articles..." aria-label="Search articles"></div><div id="articleGrid" class="article-grid"></div><div id="empty" class="empty-state">No articles found.</div></main><footer>© <span id="year"></span> DMVExposureHoops · DMV basketball coverage.</footer><script>document.getElementById('year').textContent=new Date().getFullYear();</script><script src="Articles.js"></script><script>
const grid=document.getElementById('articleGrid'),search=document.getElementById('search');function render(){const q=search.value.toLowerCase().trim(),items=articles.filter(a=>(a.title+' '+a.content+' '+a.classYear).toLowerCase().includes(q));grid.innerHTML='';document.getElementById('empty').style.display=items.length?'none':'block';items.forEach((a,i)=>{const card=document.createElement('a');card.className='article-card';card.href='article.html?id='+i;card.style.textDecoration='none';card.style.color='inherit';const h=document.createElement('h2');h.textContent=a.title;const meta=document.createElement('div');meta.className='article-meta';meta.textContent='Class of '+(a.classYear||'—')+' · '+(a.date||'');const p=document.createElement('p');p.textContent=(a.content||'').slice(0,180)+(a.content&&a.content.length>180?'…':'');const more=document.createElement('span');more.className='read-more';more.textContent='Read feature ↗';card.append(h,meta,p,more);grid.append(card)})}search.addEventListener('input',render);render();
