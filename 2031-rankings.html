<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2031 DMV Rankings | DMVExposureHoops</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}
header{background:#111;border-bottom:2px solid #ff6a00;padding:20px;text-align:center}
.logo{font-size:28px;font-weight:bold}.logo span{color:#ff6a00}
nav{margin-top:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px}
nav a:hover{color:#ff6a00}
.container{max-width:1000px;margin:auto;padding:35px 20px}
h1{text-align:center;color:#ff6a00;font-size:36px}
.subtitle{text-align:center;color:#aaa;margin-bottom:30px}
.search{width:100%;padding:14px;background:#151515;border:1px solid #333;border-radius:7px;color:#fff;font-size:16px;margin-bottom:20px}
.ranking{display:flex;align-items:center;background:#121212;border:1px solid #292929;border-left:4px solid #ff6a00;border-radius:7px;padding:16px;margin-bottom:10px}
.number{width:55px;font-size:24px;font-weight:bold;color:#ff6a00}
.info{flex:1}.name{font-size:19px;font-weight:bold}.school{color:#aaa;margin-top:5px}
footer{text-align:center;padding:35px;color:#666}
</style>
<link rel="stylesheet" href="site.css">
</head>

<body>

<header>
<div class="logo">DMV<span>Exposure</span>Hoops</div>

<nav>
<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="players.html">Player Profiles</a>
<a href="watchlists.html">Watchlists</a>
<a href="rankings.html">Rankings</a>
<a href="exposure.html">Get Exposure</a>
</nav>
</header>

<div class="container">

<h1>2031 DMV Top 50</h1>

<p class="subtitle">DMV area rankings for the Class of 2031</p>

<input id="search" class="search"
placeholder="Search player or school..."
onkeyup="displayRankings()">

<div id="rankings"></div>

</div>

<footer>© 2026 DMVExposureHoops</footer>

<script>

const rankings = [];

function displayRankings(){

const search=document.getElementById("search").value.toLowerCase();
const container=document.getElementById("rankings");

container.innerHTML="";

rankings.forEach((player,index)=>{

if(player[0].toLowerCase().includes(search) ||
player[1].toLowerCase().includes(search)){

container.innerHTML+=`
<div class="ranking">
<div class="number">${index+1}</div>
<div class="info">
<div class="name">${player[0]}</div>
<div class="school">${player[1]}</div>
</div>
</div>
`;

}

});

}

displayRankings();

</script>

</body>
</html>
