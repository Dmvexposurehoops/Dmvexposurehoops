<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Player Watchlists | DMVExposureHoops</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.top{background:#101010;border-bottom:2px solid #ff6a00;padding:22px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.logo{font-weight:900;font-size:24px;letter-spacing:-.04em}.logo span{color:#ff6a00}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#eee;text-decoration:none;padding:9px 12px;border-radius:6px;font-size:14px}.nav a:hover,.nav a.active{background:#ff6a00;color:#111}.wrap{max-width:1100px;margin:auto;padding:38px 18px 60px}.eyebrow{text-transform:uppercase;color:#ff6a00;font-weight:800;letter-spacing:.15em;font-size:12px;text-align:center}h1{text-align:center;font-size:clamp(32px,6vw,48px);margin:10px 0}.sub{text-align:center;color:#aaa;margin:0 auto 25px;max-width:600px}.controls{display:flex;justify-content:center;gap:12px;margin:24px 0 18px;flex-wrap:wrap}select,input{background:#151515;color:#fff;border:1px solid #444;border-radius:7px;padding:13px 15px;font-size:16px}select{border-color:#ff6a00;min-width:210px}input{width:min(100%,520px)}.frame-wrap{background:#101010;border:1px solid #292929;border-radius:12px;overflow:hidden}iframe{display:block;width:100%;border:0;min-height:500px;background:#080808}footer{text-align:center;color:#777;padding:24px;border-top:1px solid #242424;font-size:13px}@media(max-width:600px){.top{align-items:flex-start}.logo{font-size:21px}.nav a{padding:8px;font-size:13px}.wrap{padding-top:28px}}
</style><link rel="stylesheet" href="site.css">
</head><body>
<header class="top"><a class="logo" href="index.html" style="text-decoration:none;color:white">DMV<span>Exposure</span>Hoops</a><nav class="nav"><a href="index.html">Home</a><a href="players.html">Players</a><a class="active" href="watchlists.html">Watchlists</a><a href="rankings.html">Rankings</a><a href="articles.html">Articles</a><a href="shop.html">Shop</a></nav></header>
<main class="wrap"><div class="eyebrow">DMV basketball</div><h1>Player Watchlists</h1><p class="sub">Choose a graduating class to browse its watchlist. Use each class's month selector to switch between updates where available.</p>
<div class="controls"><select id="classSelect" aria-label="Choose graduating class"><option value="2028-watchlist.html">Class of 2028</option><option value="2029-watchlist.html" selected>Class of 2029</option><option value="2030-watchlist.html">Class of 2030</option><option value="2031-watchlist.html">Class of 2031</option></select></div>
<div class="frame-wrap"><iframe id="classFrame" title="Selected class watchlist" src="2029-watchlist.html" loading="eager"></iframe></div></main>
<footer>© 2026 DMVExposureHoops</footer>
<script>
const selector=document.getElementById('classSelect'),frame=document.getElementById('classFrame');
function prepareFrame(){try{const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='header, nav, footer, .logo{display:none!important} body{background:#080808!important} .container{padding-top:18px!important} h1,.page-title,.title{display:none!important} .subtitle{margin-top:0!important}';d.head.appendChild(style);const resize=()=>{frame.style.height=Math.max(520,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'};resize();setTimeout(resize,250);setTimeout(resize,800);d.querySelectorAll('button,select,input').forEach(el=>el.addEventListener('click',()=>setTimeout(resize,150)));}catch(e){frame.style.height='1600px'}}
selector.addEventListener('change',()=>{frame.src=selector.value});frame.addEventListener('load',prepareFrame);prepareFrame();
</script></body></html>
