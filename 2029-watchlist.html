<title>2029 Watchlist | DMVExposureHoops</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}
header{background:#111;border-bottom:2px solid #ff6a00;padding:20px;text-align:center}
.logo{font-size:28px;font-weight:bold}.logo span{color:#ff6a00}
nav{margin-top:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px}
nav a:hover{color:#ff6a00}
.container{max-width:1100px;margin:auto;padding:35px 20px}
h1{text-align:center;color:#ff6a00;font-size:36px}
.subtitle{text-align:center;color:#aaa}
.controls{text-align:center;margin:25px 0}
select{background:#151515;color:#fff;border:1px solid #ff6a00;padding:12px 18px;border-radius:7px;font-size:16px}
.search{width:100%;padding:14px;background:#151515;border:1px solid #333;border-radius:7px;color:#fff;font-size:16px;margin-bottom:20px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.player{background:#121212;border:1px solid #292929;border-left:4px solid #ff6a00;border-radius:7px;padding:18px}
.player h3{margin:0 0 8px}
.height{color:#aaa}
footer{text-align:center;padding:35px;color:#666}
</style>

<p class="subtitle">

</p>

<div class="controls">

<select id="month" onchange="displayPlayers()">

<option value="october">October 2026</option>

</select>

</div>

<input
id="search"
class="search"
placeholder="Search players..."
onkeyup="displayPlayers()"
>

function displayPlayers(){

const month=document.getElementById("month").value;
const search=document.getElementById("search").value.toLowerCase();

const container=document.getElementById("players");

container.innerHTML="";

watchlists[month]
.filter(player=>player[0].toLowerCase().includes(search))
.forEach((player,index)=>{

container.innerHTML+=`
<div class="player">
<h3>${index+1}. ${player[0]}</h3>
<div class="height">Height: ${player[1]}</div>
</div>
`;

});

}

displayPlayers();
