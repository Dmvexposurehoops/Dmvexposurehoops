<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><link rel="stylesheet" href="site.css"><title>Player Profile | DMVExposureHoops</title></head><body><header><a class="logo" href="index.html">DMV<span>Exposure</span>Hoops</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="players.html">Players</a><a href="watchlists.html">Watchlists</a><a href="rankings.html">Rankings</a><a href="articles.html">Articles</a><a href="exposure.html">Get Exposure</a></nav></header><main><a class="back-button" href="players.html">← All Players</a><div id="profile"></div></main><footer>© <span id="year"></span> DMVExposureHoops · DMV basketball coverage.</footer><script>document.getElementById('year').textContent=new Date().getFullYear();</script><script src="Players.js"></script><script>
const name=new URLSearchParams(location.search).get('name')||'',p=players.find(x=>x.name.toLowerCase()===name.toLowerCase()),root=document.getElementById('profile');
if(!p){root.innerHTML='<div class="empty-state">Player profile not found. <a href="players.html">Browse all players</a>.</div>'}else{document.title=p.name+' | DMVExposureHoops';const hero=document.createElement('section');hero.className='hero';const ey=document.createElement('span');ey.className='eyebrow';ey.textContent='CLASS OF '+p.classYear+' · DMV BASKETBALL';const h=document.createElement('h1');h.textContent=p.name;const sub=document.createElement('p');sub.textContent=[p.position,p.school,p.aauTeam].filter(Boolean).join(' · ');hero.append(ey,h,sub);const stats=document.createElement('div');stats.className='grid';[['Height',p.height],['Weight',p.weight],['Position',p.position],['School',p.school],['AAU Team',p.aauTeam],['Class',''+p.classYear]].forEach(([k,v])=>{if(v){const c=document.createElement('div');c.className='card';const label=document.createElement('span');label.className='eyebrow';label.textContent=k;const value=document.createElement('h3');value.textContent=v;c.append(label,value);stats.append(c)}});const bio=document.createElement('section');bio.className='cta';const bh=document.createElement('h2');bh.textContent='Player Overview';const bp=document.createElement('p');bp.style.whiteSpace='pre-line';bp.textContent=p.bio||'Player information coming soon.';bio.append(bh,bp);root.append(hero,stats,bio);if(p.highlightLink){const link=document.createElement('a');link.className='button primary';link.href=p.highlightLink;link.target='_blank';link.rel='noopener';link.textContent='Watch Highlights ↗';bio.append(link)}}
</script></body></html>
