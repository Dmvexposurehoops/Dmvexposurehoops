<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><link rel="stylesheet" href="site.css"><title>Player Profiles | DMVExposureHoops</title></head><body><header><a class="logo" href="index.html">DMV<span>Exposure</span>Hoops</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="players.html">Players</a><a href="watchlists.html">Watchlists</a><a href="rankings.html">Rankings</a><a href="articles.html">Articles</a><a href="exposure.html">Get Exposure</a></nav></header><main><div class="eyebrow">The DMV prospect database</div><h1 class="page-title">Player Profiles</h1><p class="page-subtitle">Search basketball players by name, school, position or graduating class.</p><div class="toolbar"><input id="search" type="search" placeholder="Search players, schools, teams..." aria-label="Search players"><select id="classFilter" aria-label="Filter by class"><option value="">All classes</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option><option>2031</option></select></div><div class="results-heading"><h2>Prospect database</h2><span id="count"></span></div><div id="playerGrid" class="player-grid"></div><div id="empty" class="empty-state">No players match your search yet.</div></main><footer>© <span id="year"></span> DMVExposureHoops · DMV basketball coverage.</footer><script>document.getElementById('year').textContent=new Date().getFullYear();</script><script src="Players.js"></script><script>
const grid=document.getElementById('playerGrid'),search=document.getElementById('search'),filter=document.getElementById('classFilter');
function render(){const q=search.value.toLowerCase().trim(),cl=filter.value;const list=players.filter(p=>(!cl||p.classYear===cl)&&[p.name,p.school,p.position,p.aauTeam,p.classYear].join(' ').toLowerCase().includes(q));grid.innerHTML='';document.getElementById('count').textContent=list.length+' player'+(list.length===1?'':'s');document.getElementById('empty').style.display=list.length?'none':'block';list.forEach(p=>{const a=document.createElement('a');a.className='player-card';a.href='player.html?name='+encodeURIComponent(p.name);a.style.textDecoration='none';a.style.color='inherit';const banner=document.createElement('div');banner.className='card-banner';const cl=document.createElement('span');cl.className='class-label';cl.textContent='CLASS OF '+p.classYear;const initials=document.createElement('span');initials.className='initials';initials.textContent=p.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();banner.append(cl,initials);const body=document.createElement('div');body.className='card-content';const h=document.createElement('h3');h.textContent=p.name;const pos=document.createElement('div');pos.className='position';pos.textContent=p.position||'Basketball';const details=document.createElement('p');details.textContent=[p.height,p.school,p.aauTeam].filter(Boolean).join(' · ');const link=document.createElement('span');link.className='read-more';link.textContent='View player profile ↗';body.append(h,pos,details,link);a.append(banner,body);grid.append(a)})}
search.addEventListener('input',render);filter.addEventListener('change',render);render();
</script></body></html>
