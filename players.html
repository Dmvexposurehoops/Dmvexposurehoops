
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Profile | DMVExposureHoops</title>
<style>
:root{--orange:#ff6a00;--bg:#101010;--card:#1b1b1b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:white;font-family:Arial,sans-serif;min-height:100vh}
header{background:#080808;border-bottom:2px solid var(--orange);padding:20px 6%}
.nav{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:900;color:white;text-decoration:none}
.logo span{color:var(--orange)}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-size:14px}
nav a:hover{color:var(--orange)}
main{max-width:900px;margin:auto;padding:35px 20px 70px}
.back{display:inline-block;color:var(--orange);text-decoration:none;font-weight:bold;margin-bottom:25px}
.profile-banner{padding:35px 25px;background:radial-gradient(ellipse at top right,#542508,#191919 70%);border:1px solid #383838;border-radius:13px;margin-bottom:25px}
.eyebrow{color:var(--orange);font-weight:bold;letter-spacing:3px;font-size:12px}
h1{font-size:clamp(32px,6vw,48px);margin:14px 0 8px}
.school{color:#ccc;font-size:16px}
.tag{display:inline-block;background:var(--orange);color:#111;padding:8px 11px;border-radius:4px;font-size:12px;font-weight:bold;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:25px}
.stat{background:var(--card);border:1px solid #333;border-radius:9px;padding:18px}
.stat small{display:block;color:#aaa;text-transform:uppercase;font-size:11px;margin-bottom:8px;letter-spacing:1px}
.stat strong{font-size:17px}
.section{background:var(--card);border:1px solid #333;border-radius:12px;padding:25px;margin-bottom:20px}
h2{font-size:21px;margin-bottom:16px}
h2 span{color:var(--orange)}
.writeup{color:#ddd;line-height:1.9;font-size:16px;white-space:pre-line}
.team{color:#ddd;line-height:1.8}
.button{display:inline-block;background:var(--orange);color:#111;text-decoration:none;font-weight:bold;padding:13px 17px;border-radius:6px;margin-top:10px}
.missing{text-align:center;padding:70px 15px}
.missing p{color:#bbb;line-height:1.7;margin:15px 0}
footer{background:#080808;border-top:1px solid #333;text-align:center;padding:25px;color:#aaa;font-size:13px}
footer strong{color:var(--orange)}
@media(max-width:500px){header{padding:18px}main{padding:25px 14px 50px}.profile-banner,.section{padding:20px}}
</style>
</head>
<body>
<header>
<div class="nav">
<a class="logo" href="index.html">DMV<span>EXPOSURE</span>HOOPS</a>
<nav>
<a href="index.html">Home</a>
<a href="players.html">Players</a>
<a href="articles.html">Articles</a>
</nav>
</div>
</header>

<main id="content"></main>

<footer><strong>DMVEXPOSUREHOOPS</strong><br><br>More exposure. More opportunity.</footer>

<script>
const players = {
  "jeremiah-harris": {
    name: "Jeremiah Harris",
    classYear: "2029",
    height: "6'4\"",
    weight: "160 lbs",
    position: "Wing / Forward",
    school: "Woodbridge Senior High School",
    team: "Bayou Elite",
    writeup: "Jeremiah Harris is a Class of 2029 wing/forward at Woodbridge Senior High School who plays for Bayou Elite. At 6'4\", Harris brings versatility to the floor with his ability to attack the basket, protect the rim, and make smart decisions. His slashing ability allows him to put pressure on the defense, while his rim protection helps him contribute on the defensive end. With a high basketball IQ and an ability to impact both ends of the floor, Harris continues to develop his game as a versatile forward.",
    highlightLink: "https://x.com/jeremiahh2029/status/2082234007274627181"
  },
  "princeton-dillard": {
    name: "Princeton Dillard",
    classYear: "2030",
    height: "5'11\"",
    weight: "125 lbs",
    position: "PG / SG",
    school: "Bassett High School",
    team: "",
    writeup: "Princeton Dillard is a Class of 2030 guard from Bassett High School who brings a versatile offensive skill set to the backcourt. Dillard's ball-handling allows him to create opportunities with the ball in his hands, while his shooting ability makes him a threat both on and off the ball. He can also get to the basket and put pressure on defenders by attacking the rim. On the other end of the floor, Dillard looks to contribute defensively and impact the game beyond scoring. Reported as the #13-ranked player in the state, Dillard is a guard to keep an eye on as he continues to develop.",
    highlightLink: ""
  }
};

const params = new URLSearchParams(window.location.search);
const player = players[params.get("id")];
const content = document.getElementById("content");

if (!player) {
  document.title = "Player Not Found | DMVExposureHoops";
  content.innerHTML = `
    <section class="missing">
      <h1>Player Not Found</h1>
      <p>This player profile could not be found. Return to the player directory to browse available profiles.</p>
      <a class="button" href="players.html">Back to Players</a>
    </section>`;
} else {
  document.title = `${player.name} | DMVExposureHoops`;

  content.innerHTML = `
    <a class="back" href="players.html">← Back to All Players</a>

    <section class="profile-banner">
      <div class="eyebrow">DMVEXPOSUREHOOPS PLAYER PROFILE</div>
      <h1>${player.name}</h1>
      <div class="school">${player.school}</div>
      <span class="tag">CLASS OF ${player.classYear}</span>
    </section>

    <section class="stats">
      <div class="stat"><small>Position</small><strong>${player.position}</strong></div>
      <div class="stat"><small>Height</small><strong>${player.height}</strong></div>
      <div class="stat"><small>Weight</small><strong>${player.weight}</strong></div>
      <div class="stat"><small>Class</small><strong>${player.classYear}</strong></div>
    </section>

    <section class="section">
      <h2>Player <span>Writeup</span></h2>
      <p class="writeup">${player.writeup}</p>
    </section>

    ${player.team ? `
      <section class="section">
        <h2>Team <span>Information</span></h2>
        <p class="team"><strong>School:</strong> ${player.school}<br><strong>AAU Team:</strong> ${player.team}</p>
      </section>` : ""}

    ${player.highlightLink ? `
      <section class="section">
        <h2>Highlights &amp; <span>Film</span></h2>
        <p class="team">Watch ${player.name}'s available highlight video.</p>
        <a class="button" href="${player.highlightLink}" target="_blank" rel="noopener noreferrer">Watch Highlights →</a>
      </section>` : ""}
  `;
}
</script>
</body>
</html>
