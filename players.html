<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player Profiles | DMVExposureHoops</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: white;
}

header {
  background: #101010;
  border-bottom: 2px solid #ff6a00;
  padding: 20px;
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.logo span {
  color: #ff6a00;
}

nav {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  padding: 7px 10px;
}

nav a:hover {
  color: #ff6a00;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 50px 20px;
}

h1 {
  text-align: center;
  font-size: 40px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 40px;
}

.player-card {
  background: #121212;
  border: 1px solid #292929;
  border-top: 4px solid #ff6a00;
  border-radius: 10px;
  padding: 30px;
  margin-bottom: 25px;
}

.player-card h2 {
  margin-top: 0;
  color: #ff6a00;
}

.info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.info div {
  background: #1b1b1b;
  padding: 12px;
  border-radius: 6px;
}

.label {
  color: #888;
  font-size: 12px;
  display: block;
  margin-bottom: 4px;
}

.bio {
  color: #ccc;
  line-height: 1.7;
  white-space: pre-line;
}

.highlight {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 18px;
  background: #ff6a00;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #666;
}
</style>
</head>

<body>

<header>

<div class="logo">
DMV<span>Exposure</span>Hoops
</div>

<nav>
<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="players.html">Player Profiles</a>

<a href="2027-rankings.html">2027 Rankings</a>
<a href="2028-rankings.html">2028 Rankings</a>
<a href="2029-rankings.html">2029 Rankings</a>
<a href="2030-rankings.html">2030 Rankings</a>

<a href="2028-watchlist.html">2028 Watchlist</a>
<a href="2029-watchlist.html">2029 Watchlist</a>
<a href="2030-watchlist.html">2030 Watchlist</a>
<a href="2031-watchlist.html">2031 Watchlist</a>
</nav>

</header>

<div class="container">

<h1>Player Profiles</h1>

<p class="subtitle">
DMVExposureHoops player profiles
</p>

<div id="players-container"></div>

</div>

<footer>
© 2026 DMVExposureHoops
</footer>

<script src="Players.js"></script>

<script>

const container = document.getElementById("players-container");

players.forEach(player => {

  const card = document.createElement("div");

  card.className = "player-card";

  card.innerHTML = `

    <h2>${player.name}</h2>

    <div class="info">

      <div>
        <span class="label">Class</span>
        ${player.classYear}
      </div>

      <div>
        <span class="label">Height</span>
        ${player.height}
      </div>

      <div>
        <span class="label">Weight</span>
        ${player.weight}
      </div>

      <div>
        <span class="label">Position</span>
        ${player.position}
      </div>

      <div>
        <span class="label">School</span>
        ${player.school}
      </div>

      <div>
        <span class="label">AAU Team</span>
        ${player.aauTeam}
      </div>

    </div>

    <div class="bio">
      ${player.bio}
    </div>

    ${
      player.highlightLink
      ? `<a class="highlight" href="${player.highlightLink}" target="_blank">
          View Highlights
        </a>`
      : ""
    }

  `;

  container.appendChild(card);

});

</script>

</body>
</html>
